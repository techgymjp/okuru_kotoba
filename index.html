<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贈る言葉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .image-container {
            margin: 20px 0;
            text-align: center;
        }

        .butterfly-image {
            max-width: 200px;
            max-height: 150px;
            width: auto;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .butterfly-image:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .message-container {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .message {
            font-size: 1.3em;
            line-height: 1.8;
            color: #444;
            font-weight: 400;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 1px;
            margin: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .stats {
            margin-top: 30px;
            color: #666;
            font-size: 0.9em;
        }

        .reset-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            margin-top: 20px;
        }

        .reset-button:hover {
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .initial-message {
            color: #888;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .message {
                font-size: 1.1em;
            }
            
            .button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">贈る言葉</h1>
        
        <div class="image-container">
            <img src="kocho.jpg" alt="胡蝶" class="butterfly-image" id="butterflyImage">
        </div>
        
        <div class="message-container">
            <div class="message initial-message" id="messageText">
                「次の言葉を見る」ボタンを押してください
            </div>
        </div>
        
        <button class="button" id="nextButton" onclick="showNextMessage()">
            次の言葉を見る
        </button>
        
        <div class="stats" id="stats">
            読み込み中…
        </div>
        
        <button class="button reset-button" id="resetButton" onclick="resetMessages()" style="display: none;">
            最初からやり直す
        </button>
    </div>

            "フランチャイズ本部の社長は何よりコミュニティ・リーダーとしてのキャラ立ちが大事だ。イメージで言えばイチロー氏みたいな感じが最高。変わり者だがそこに独自の世界観がある。そして変化に対応しながら成長を続けて、ブレない。そこに価値観の合う人が集まり着いていくイメージが持てる。比較で言えば松井秀喜氏は向いてない。こちらは人格者で優しいが、何故か人が着いてくイメージがない。",
            "ダメな人には考え方の癌みたいのがあって、コイツは完全に取り去ることが難しい。ちょっと消えたと思ってもまた再発する。やっぱり付き合う人、周りの環境を変えることだな♪",

            "「この事業を是非FC化したい、全国展開したい！」と鼻息荒く相談に来る方は、結局自分が本部として儲けたいだけだったり、会社がピンチで起死回生策としてFC化！だったりする。",

            "FC本部はそのお金を払い続けてもらう「価値あるビジネスモデル・ノウハウ・集客力」を提供できるか？が問われる。FCなんだから払ってもらうのは当たり前、なんて腹の底で考えている本部は長くは続きません。",
             "「有頂天」という言葉があるが、「天」というのは足が地についていないこと。そこから上に昇っていけるかは社長の考え方次第。",
            "直営向きの社長とFC向きの社長というテーマがある。様々な観点があるが、基本は「加盟してくれた相手の店が儲かることが直営で儲けることよりも嬉しいという感覚」がどれだけあるか、だと思う。この感覚は本能的な欲のところからきていて、伝説のAV男優 加藤鷹氏もこんなこと言っている。「同じSEXをするなら相手を悦ばせ、自分ももっと深い快感を得たいという欲望は、人間の三大欲のひとつである」まずは相手を悦ばせるから自らの深い快感が得られる、この順番が大事で、ここに響く人はFC本部社長向き、ということね（笑）",
            "僕のフランチャイズとの出会いは、50年前に実家の酒屋の斜め前の八百屋がセブンイレブンになったこと。無茶苦茶汚い店がピッカピカのセブンイレブンになった。どーせまた…と思っていたらピッカピカのまま繁盛し続けた。やってる夫婦は同じなのに。フランチャイズってスゲーと思った（笑）これが原点。",
            "オーナーとして飯はそこそこ食えるが人雇ったら利益はチョボチョボ以下、というFCモデルでは経営者にはなれない。それをFC本部はウチは負けないFCですよ、リスクが小さいのがウリ！と言ったりする。それは嘘じゃ無いけど、リスクをも取らなきゃ経営者にはなれないよ。",
            "オーナーで成功するまではカネで苦労する。カネの苦労が無くなって複数店舗経営して経営者になるとヒトで苦労する。ヒトの苦労が無くなり、既存事業は任せて回るような仕組みが出来たら、企業家になって新事業の「企て」をする。別の視点から言えば、FCを選ぶ際にオーナーから経営者になっている比率を見ることも重要。",
            "フランチャイズには大きな夢があるよ。でもその夢を追って失敗する人もいる。成功と失敗の間にあるのは可能性。この可能性は加盟する人によって大きく変わる。自分に賭けてみるか？みないか？は自分次第。",
            "自分自身についての「メタ認知的知識」を常に意識するのは大事。競馬好きなら「自分は次はどんなレースに出て競馬新聞でどの程度印がついていて、何番人気？単勝何倍なのか？」「どんな人が馬券を買って賭けてくれるか？」とか考えてみる。それで結果どうだったか？それを繰り返し、自分の馬柱を作っていく…",
            "「ドーナツをつくるのではない、人をつくるのです」これは日本のFCの祖ダスキン創業者の鈴木清一氏が、ミスタードーナツのFC募集開始時に、巨大な研修センターをつくった際に語った言葉。ダスキンを成功させる中で、フランチャイズを「人づくり＝教育ビジネス」定義していた。ちなみに、店舗アルバイトまで参加させて成功ナレッジを共有する仕組みを日本で最初に作ったのがミスドFCだよ。",
            "FCってのは皆が思ってる以上に、何をやるか？より誰がやるか？なんだよ。だからFC本部は良い加盟者が集まるように知恵を絞るべき。",
            "本部社長や幹部には丁寧に接するのに、SV等若い社員には偉そうにする人がいる。中には電話で女性本部スタッフを怒鳴ったり。そんなのはすぐに本部内で評判になって、あのオーナーは本当困ります、となる。当然、成功確率は低い。",
            "FC本部に対しては今後の関係も考えてしないけど、内装含め業者関係は相見積取りまくって最後にまた値切る、難癖つけて値引かせる、という人が一定割合いる。人間性の問題で成功確率低いタイプ。",
            "詳しそうな人にオススメのFC教えて、なんて言ってくる奴は考え方を変えないとまず成功しない。世の中そんな甘くない。これから伸びそうなFC教えて、ならまだマシだが予想が当たるとは限らない。",
            "良いFCに加盟＝成功　ではなく　良いFCに加盟→成功で、矢印は自分。",

            "暑い…でも…だから今夜のビールは美味い！と考える。これサラリーマン上級の発想。そうやってポジティブに日々頑張れば出世します。"
        ];

        const STORAGE_KEY = 'okuru-kotoba-v2';
        let availableMessages = [];
        let shownMessages = [];
        let busy = false;

        // Fisher-Yatesアルゴリズムで配列をシャッフル
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 残りの順番と表示済みをブラウザに保存する（再読み込みしても続きから）
        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ available: availableMessages, shown: shownMessages }));
            } catch (e) { /* 保存できない環境では何もしない */ }
        }

        function load() {
            try {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!data) return false;
                // 言葉のリストを編集したあとでも壊れないよう、今のリストにある言葉だけ残す
                const all = new Set(sampleMessages);
                const shown = data.shown.filter(m => all.has(m));
                const seen = new Set([...data.available, ...shown]);
                const added = sampleMessages.filter(m => !seen.has(m));
                availableMessages = data.available.filter(m => all.has(m)).concat(shuffleArray(added));
                shownMessages = shown;
                return true;
            } catch (e) {
                return false;
            }
        }

        // 効果音は最初に1回だけ読み込み、押すたびに複製して鳴らす（連打しても音が途切れない）
        const buttonSound = new Audio('btn.mp3');
        buttonSound.preload = 'auto';
        buttonSound.volume = 0.5;
        function playButtonSound() {
            const sound = buttonSound.cloneNode();
            sound.volume = 0.5;
            sound.play().catch(error => {
                console.log('ボタン音の再生に失敗しました:', error);
            });
        }

        function showNextMessage() {
            if (busy || availableMessages.length === 0) return;
            busy = true;
            playButtonSound();

            const selectedMessage = availableMessages.shift();
            shownMessages.push(selectedMessage);
            save();

            const messageElement = document.getElementById('messageText');
            messageElement.classList.remove('show');
            messageElement.classList.remove('initial-message');

            setTimeout(() => {
                messageElement.textContent = selectedMessage;
                messageElement.classList.add('show');
                busy = false;
            }, 250);

            updateStats();
        }

        function updateStats() {
            const statsElement = document.getElementById('stats');
            statsElement.textContent = `残り: ${availableMessages.length}件 | 表示済み: ${shownMessages.length}件`;
            const done = availableMessages.length === 0;
            if (done) statsElement.textContent += ' | すべてのメッセージを表示しました！';
            document.getElementById('nextButton').disabled = done;
            document.getElementById('resetButton').style.display = done ? 'inline-block' : 'none';
        }

        function resetMessages() {
            playButtonSound();
            availableMessages = shuffleArray([...sampleMessages]);
            shownMessages = [];
            save();

            const messageElement = document.getElementById('messageText');
            messageElement.classList.remove('show');
            messageElement.classList.add('initial-message');
            setTimeout(() => {
                messageElement.textContent = '「次の言葉を見る」ボタンを押してください';
                messageElement.classList.add('show');
            }, 250);
            updateStats();
        }

        function initializeApp() {
            if (!load()) {
                availableMessages = shuffleArray([...sampleMessages]);
                shownMessages = [];
                save();
            }
            const messageElement = document.getElementById('messageText');
            if (shownMessages.length > 0) {
                messageElement.textContent = shownMessages[shownMessages.length - 1];
                messageElement.classList.remove('initial-message');
            }
            messageElement.classList.add('show');
            updateStats();
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
